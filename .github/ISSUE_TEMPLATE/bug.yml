name: Bug Report
description: Something is broken or behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include error messages or tracebacks.
      render: shell
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Requirement or Business Rule Broken
      placeholder: "BR-07 payment cannot exceed balance"
  - type: input
    id: location
    attributes:
      label: Affected Class / File
      placeholder: "src/hpms/model/bill.py – add_payment()"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["P1 - Crash / blocks work", "P2 - Wrong result, workaround exists", "P3 - Minor / cosmetic"]
    validations:
      required: true
